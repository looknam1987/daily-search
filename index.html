<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Daily Status Search</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="StatusSearch">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2642/2642232.png">

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dexie@3.2.4/dist/dexie.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">

  <div class="max-w-xl mx-auto bg-white rounded-xl shadow-lg p-6 border border-gray-200">
    <div class="text-center font-bold text-xl mb-4 text-gray-800">DAILY STATUS SEARCH</div>
    
    <!-- ช่องค้นหา พร้อมปุ่มล้างข้อมูลและปุ่มค้นหา -->
    <div class="flex gap-2 mb-4">
      <div class="relative flex-1">
        <input type="text" id="searchInput" oninput="debounceSearch()" placeholder="พิมพ์คำค้นหา (Tracking, Order, Phone...)" class="w-full border border-gray-300 p-2.5 pr-8 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        <!-- ปุ่มเคลียร์คำค้นหา (❌) -->
        <button id="clearBtn" onclick="clearSearch()" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 font-bold text-sm bg-gray-100 hover:bg-gray-200 rounded-full w-5 h-5 flex items-center justify-center">
          ✕
        </button>
      </div>
      <button onclick="searchData()" class="bg-blue-600 text-white px-4 py-2.5 rounded-lg hover:bg-blue-700 font-medium">🔍</button>
    </div>

    <!-- ตัวเลือกประเภทการค้นหา -->
    <div class="flex gap-4 text-sm mb-4 justify-center text-gray-600">
      <label class="cursor-pointer"><input type="radio" name="searchType" value="all" checked onchange="searchData()"> All</label>
      <label class="cursor-pointer"><input type="radio" name="searchType" value="tracking" onchange="searchData()"> Tracking</label>
      <label class="cursor-pointer"><input type="radio" name="searchType" value="order" onchange="searchData()"> Order</label>
      <label class="cursor-pointer"><input type="radio" name="searchType" value="phone" onchange="searchData()"> Phone</label>
    </div>

    <!-- ปุ่มเลือกไฟล์ Excel -->
    <div class="mb-5 text-center">
      <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" onchange="loadExcel(event)" class="hidden">
      <label for="excelFile" id="uploadBtnLabel" class="inline-block cursor-pointer bg-blue-50 hover:bg-blue-100 text-blue-700 px-4 py-2.5 rounded-lg border border-blue-200 text-xs font-semibold transition">
        📁 เลือก/อัปเดตไฟล์ Excel ในเครื่อง
      </label>
    </div>

    <!-- จำนวนรายการและปุ่ม Export -->
    <div class="flex justify-between items-center mb-4 border-b pb-2">
      <div class="text-sm font-bold text-gray-700" id="resultCount">พบข้อมูล 0 รายการ</div>
      <button onclick="exportExcel()" class="bg-green-600 text-white px-4 py-1.5 rounded-lg text-sm font-medium hover:bg-green-700 shadow-sm">[ EXPORT EXCEL ]</button>
    </div>

    <!-- กล่องแสดงข้อความผลลัพธ์ -->
    <div id="resultsContainer" class="space-y-3 max-h-[450px] overflow-y-auto pr-1">
      <!-- ข้อมูลจากการค้นหาจะมาปรากฏตรงนี้ -->
    </div>
  </div>

  <script>
    const db = new Dexie("StatusSearchDB_v7");
    db.version(1).stores({
      records: '++id, tracking, order, phone, searchBlob'
    });

    let currentResults = [];
    let searchTimer = null;

    function formatDate(val) {
      if (!val) return '-';
      let dateObj;
      if (typeof val === 'number' || !isNaN(val)) {
        const parsedNum = Number(val);
        if (parsedNum > 20000 && parsedNum < 60000) {
          dateObj = new Date(Math.round((parsedNum - 25569) * 86400 * 1000));
        }
      }
      if (!dateObj) dateObj = new Date(val);
      if (isNaN(dateObj.getTime())) return String(val);

      const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      return `${String(dateObj.getDate()).padStart(2, '0')}/${months[dateObj.getMonth()]}/${dateObj.getFullYear()}`;
    }

    async function loadExcel(e) {
      const file = e.target.files[0];
      if (!file) return;

      const label = document.getElementById('uploadBtnLabel');
      label.innerText = '⏳ กำลังอ่านไฟล์...';

      setTimeout(async () => {
        try {
          const data = await file.arrayBuffer();
          const workbook = XLSX.read(data, { type: 'array' });
          
          if (!workbook.SheetNames || workbook.SheetNames.length === 0) {
            alert('ไม่พบ Sheet ข้อมูลในไฟล์นี้');
            label.innerText = '📁 เลือก/อัปเดตไฟล์ Excel ในเครื่อง';
            return;
          }

          const sheetName = workbook.SheetNames[0];
          const json = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { defval: "" });

          if (!json || json.length === 0) {
            alert('ไม่พบแถวข้อมูลใน Sheet');
            label.innerText = '📁 เลือก/อัปเดตไฟล์ Excel ในเครื่อง';
            return;
          }

          label.innerText = '⏳ กำลังรวมออเดอร์ซ้ำ...';

          await db.records.clear();

          const groupedMap = new Map();

          json.forEach(row => {
            const refNo = String(row['REFERENCE_NO'] || row['ORDER NO.'] || row['Order Code in OMS'] || row['SO_NO'] || '').trim();
            const trackingNo = String(row['Tracking Number'] || row['Tracking Number Prefix'] || '').trim();
            
            const groupKey = refNo ? refNo.toLowerCase() : (trackingNo ? trackingNo.toLowerCase() : Math.random().toString());

            const itemInfo = {
              itemNo: String(row['ITEM_NO'] || '-').trim(),
              qty: String(row['QTY'] || '1').trim(),
              uom: String(row['UOM'] || '').trim()
            };

            if (groupedMap.has(groupKey)) {
              const existing = groupedMap.get(groupKey);
              existing.items.push(itemInfo);
              existing.searchBlob += ` ${itemInfo.itemNo}`;
            } else {
              const trackingVal = trackingNo.toLowerCase();
              const orderVal = refNo.toLowerCase();
              const phoneVal = String(row['PHONE'] || '').trim().toLowerCase();
              const allBlob = Object.values(row).join(' ').toLowerCase();

              groupedMap.set(groupKey, {
                raw: row,
                tracking: trackingVal,
                order: orderVal,
                phone: phoneVal,
                searchBlob: allBlob,
                items: [itemInfo]
              });
            }
          });

          const formattedData = Array.from(groupedMap.values());
          await db.records.bulkAdd(formattedData);

          alert(`นำเข้าข้อมูลสำเร็จแล้ว! รวมทั้งหมด ${formattedData.length} ออเดอร์ (จาก ${json.length} รายการ)`);
          label.innerText = '📁 เลือก/อัปเดตไฟล์ Excel ในเครื่อง';
          
          e.target.value = '';
          searchData();
        } catch (err) {
          alert('เกิดข้อผิดพลาด: ' + (err.message || 'ไม่สามารถอ่านไฟล์ได้'));
          label.innerText = '📁 เลือก/อัปเดตไฟล์ Excel ในเครื่อง';
          e.target.value = '';
          console.error(err);
        }
      }, 200);
    }

    // ฟังก์ชันหน่วงเวลาค้นหา ลดอาการกระตุก/ค้าง ขณะพิมพ์
    function debounceSearch() {
      const input = document.getElementById('searchInput');
      const clearBtn = document.getElementById('clearBtn');
      
      // แสดง/ซ่อน ปุ่ม ✕ ตามข้อความในช่องค้นหา
      if (input.value.trim() !== '') {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }

      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        searchData();
      }, 300); // รอพิมพ์หยุด 0.3 วินาทีค่อยค้นหา
    }

    // ฟังก์ชันเคลียร์ค่าค้นหา
    function clearSearch() {
      const input = document.getElementById('searchInput');
      input.value = '';
      document.getElementById('clearBtn').classList.add('hidden');
      input.focus();
      searchData();
    }

    async function searchData() {
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      const type = document.querySelector('input[name="searchType"]:checked').value;
      const container = document.getElementById('resultsContainer');

      if (!keyword) {
        currentResults = [];
        document.getElementById('resultCount').innerText = 'พบข้อมูล 0 รายการ';
        container.innerHTML = '';
        return;
      }

      let query = db.records;
      
      if (type === 'tracking') {
        currentResults = await query.filter(r => r.tracking.includes(keyword)).toArray();
      } else if (type === 'order') {
        currentResults = await query.filter(r => r.order.includes(keyword)).toArray();
      } else if (type === 'phone') {
        currentResults = await query.filter(r => r.phone.includes(keyword)).toArray();
      } else {
        currentResults = await query.filter(r => r.searchBlob.includes(keyword)).toArray();
      }

      document.getElementById('resultCount').innerText = `พบข้อมูล ${currentResults.length} รายการ`;
      renderCards();
    }

    function renderCards() {
      const container = document.getElementById('resultsContainer');
      container.innerHTML = '';

      if (currentResults.length === 0) {
        container.innerHTML = '<div class="text-center text-gray-400 py-4 text-sm">ไม่พบข้อมูลที่ค้นหา</div>';
        return;
      }

      currentResults.forEach((r, idx) => {
        const fullAddress = [
          r.raw['ที่อยู่'], r.raw['ซอย'], r.raw['ถนน'], r.raw['ตำบล'], r.raw['อำเภอ'], r.raw['จังหวัด']
        ].filter(Boolean).join(' ');

        const dateVal = formatDate(r.raw['DATE']);
        const receivingDateVal = formatDate(r.raw['Receiving Date']);
        const statusVal = r.raw['Status'] || '-';
        const remarkVal = r.raw['Remark'] || '-';

        const itemsCopyText = r.items.map(it => `สินค้า: ${it.itemNo} ${it.qty} ${it.uom}`.trim()).join('\n');

        const textToCopy = `REF: ${r.raw['REFERENCE_NO'] || '-'}\nTracking: ${r.raw['Tracking Number'] || '-'}\nDATE: ${dateVal}\nชื่อ: ${r.raw['CUSTOMER_NAME'] || '-'}\nโทร: ${r.raw['PHONE'] || '-'}\nที่อยู่: ${fullAddress || '-'} ${r.raw['POST_CODE'] || ''}\n${itemsCopyText}${r.raw['REMARKS'] ? `\nCOD: ${r.raw['REMARKS']}` : ''}\nReceiving Date: ${receivingDateVal}\nStatus: ${statusVal}\nRemark: ${remarkVal}`;

        const itemsHtml = r.items.map(it => `
          <div><span class="font-semibold text-gray-900">สินค้า:</span> ${it.itemNo} <span class="font-semibold text-gray-900">จำนวน:</span> ${it.qty} ${it.uom}</div>
        `).join('');

        const card = document.createElement('div');
        card.className = 'bg-gray-50 border border-gray-200 rounded-lg p-3.5 text-xs text-gray-700 space-y-1.5 shadow-sm relative group';
        card.innerHTML = `
          <div class="flex justify-between items-center border-b pb-1 pr-14">
            <span class="font-bold text-blue-600">#${idx + 1} REF: ${r.raw['REFERENCE_NO'] || '-'}</span>
          </div>
          <button onclick="copyToClipboard(\`${encodeURIComponent(textToCopy)}\`, this)" class="absolute top-2.5 right-2 bg-white border border-gray-300 hover:bg-blue-50 hover:text-blue-600 hover:border-blue-300 px-2 py-1 rounded text-[11px] font-medium transition flex items-center gap-1 shadow-sm">
            📋 Copy
          </button>
          <div><span class="font-semibold text-gray-900">Tracking:</span> ${r.raw['Tracking Number'] || '-'}</div>
          <div><span class="font-semibold text-gray-900">DATE:</span> ${dateVal}</div>
          <div><span class="font-semibold text-gray-900">ชื่อลูกค้า:</span> ${r.raw['CUSTOMER_NAME'] || '-'} (${r.raw['PHONE'] || '-'})</div>
          <div><span class="font-semibold text-gray-900">ที่อยู่:</span> ${fullAddress || '-'} ${r.raw['POST_CODE'] || ''}</div>
          
          <div class="bg-white p-2 rounded border border-gray-200 space-y-1 my-1">
            ${itemsHtml}
          </div>

          ${r.raw['REMARKS'] ? `<div class="text-gray-500 italic"><span class="font-semibold">COD:</span> ${r.raw['REMARKS']}</div>` : ''}
          
          <div class="border-t pt-1.5 mt-1.5 space-y-1 text-gray-800">
            <div><span class="font-semibold text-gray-900">Receiving Date:</span> ${receivingDateVal}</div>
            <div><span class="font-semibold text-gray-900">Status:</span> ${statusVal}</div>
            <div><span class="font-semibold text-gray-900">Remark:</span> ${remarkVal}</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function copyToClipboard(encodedText, btn) {
      const text = decodeURIComponent(encodedText);
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btn.innerHTML;
        btn.innerHTML = '✅ สำเร็จ';
        btn.classList.add('bg-green-50', 'text-green-600', 'border-green-300');
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.classList.remove('bg-green-50', 'text-green-600', 'border-green-300');
        }, 1500);
      }).catch(err => {
        alert('ไม่สามารถคัดลอกข้อความได้');
        console.error(err);
      });
    }

    function exportExcel() {
      if (currentResults.length === 0) return alert('ไม่มีข้อมูลสำหรับส่งออก');
      
      const exportData = [];

      currentResults.forEach(r => {
        const fullAddress = [
          r.raw['ที่อยู่'], r.raw['ซอย'], r.raw['ถนน'], r.raw['ตำบล'], r.raw['อำเภอ'], r.raw['จังหวัด']
        ].filter(Boolean).join(' ');

        r.items.forEach(it => {
          exportData.push({
            "LINE_NO": r.raw['LINE_NO'] || "",
            "DATE": formatDate(r.raw['DATE']),
            "REFERENCE_NO": r.raw['REFERENCE_NO'] || "",
            "REMARKS": r.raw['REMARKS'] || "",
            "ITEM_NO": it.itemNo,
            "QTY": it.qty,
            "UOM": it.uom,
            "CUSTOMER_NAME": r.raw['CUSTOMER_NAME'] || "",
            "ADDRESS": fullAddress,
            "POST_CODE": r.raw['POST_CODE'] || "",
            "PHONE": r.raw['PHONE'] || "",
            "Tracking Number": r.raw['Tracking Number'] || "",
            "Receiving Date": formatDate(r.raw['Receiving Date']),
            "Status": r.raw['Status'] || "",
            "Remark": r.raw['Remark'] || ""
          });
        });
      });

      const ws = XLSX.utils.json_to_sheet(exportData);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "SearchResults");
      XLSX.writeFile(wb, "Search_Result.xlsx");
    }
  </script>
</body>
</html>
