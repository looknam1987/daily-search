<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Status Search</title>

  <!-- เชื่อมต่อ Manifest & ไอคอนสำหรับ PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- โหลด Library สำหรับอ่าน Excel และ ค้นหาข้อมูล -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dexie@3.2.4/dist/dexie.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-6 border border-gray-200">
    <!-- หัวข้อ -->
    <div class="text-center font-bold text-xl mb-4 text-gray-800">DAILY STATUS SEARCH</div>
    
    <!-- ช่องค้นหา -->
    <div class="flex gap-2 mb-4">
      <input type="text" id="searchInput" oninput="searchData()" placeholder="Search..." class="flex-1 border border-gray-300 p-2.5 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      <button onclick="searchData()" class="bg-blue-600 text-white px-4 py-2.5 rounded-lg hover:bg-blue-700">🔍</button>
    </div>

    <!-- ตัวเลือกประเภทการค้นหา -->
    <div class="flex gap-4 text-sm mb-4 justify-center text-gray-600">
      <label class="cursor-pointer"><input type="radio" name="searchType" value="all" checked onchange="searchData()"> All</label>
      <label class="cursor-pointer"><input type="radio" name="searchType" value="tracking" onchange="searchData()"> Tracking</label>
      <label class="cursor-pointer"><input type="radio" name="searchType" value="order" onchange="searchData()"> Order</label>
      <label class="cursor-pointer"><input type="radio" name="searchType" value="phone" onchange="searchData()"> Phone</label>
    </div>

    <!-- ปุ่มเลือก/อัปเดตไฟล์ Excel -->
    <div class="mb-5 text-center">
      <input type="file" id="excelFile" accept=".xlsx, .xls" onchange="loadExcel(event)" class="hidden">
      <label for="excelFile" class="inline-block cursor-pointer bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg border border-gray-300 text-xs font-semibold transition">
        📁 เลือก/เปลี่ยนไฟล์ Excel ในเครื่อง
      </label>
    </div>

    <!-- แสดงจำนวนรายการที่พบ -->
    <div class="text-sm font-bold text-gray-700 mb-4 border-b pb-2" id="resultCount">พบข้อมูล 0 รายการ</div>

    <!-- ปุ่ม Action ด้านล่าง -->
    <div class="flex gap-3">
      <button onclick="previewResults()" class="flex-1 border border-gray-300 py-2 rounded-lg text-sm font-medium hover:bg-gray-50 text-gray-700">[ Preview ]</button>
      <button onclick="exportExcel()" class="flex-1 bg-green-600 text-white py-2 rounded-lg text-sm font-medium hover:bg-green-700 shadow-sm">[ EXPORT EXCEL ]</button>
    </div>
  </div>

  <script>
    // 1. ลงทะเบียน PWA Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('PWA Ready!'))
          .catch(err => console.error('PWA Error:', err));
      });
    }

    // 2. ตั้งค่า Database ความเร็วสูงในเครื่อง (IndexedDB)
    const db = new Dexie("StatusSearchDB");
    db.version(1).stores({
      records: '++id, tracking, order, phone, searchBlob'
    });

    let currentResults = [];

    // 3. อ่านไฟล์ Excel แล้วบันทึกลง IndexedDB
    async function loadExcel(e) {
      const file = e.target.files[0];
      if (!file) return;

      const data = await file.arrayBuffer();
      const workbook = XLSX.read(data);
      const sheetName = workbook.SheetNames[0];
      const json = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName]);

      await db.records.clear(); // ล้างข้อมูลเก่าออก
      
      // แปลงข้อมูลเตรียมไว้สำหรับการค้นหาแบบทันที
      const formattedData = json.map(row => ({
        raw: row,
        tracking: String(row['Tracking'] || row['tracking'] || '').toLowerCase(),
        order: String(row['Order'] || row['order'] || '').toLowerCase(),
        phone: String(row['Phone'] || row['phone'] || '').toLowerCase(),
        searchBlob: Object.values(row).join(' ').toLowerCase()
      }));

      await db.records.bulkAdd(formattedData);
      alert('อัปเดตข้อมูล Excel เข้าเครื่องเรียบร้อยแล้ว!');
      searchData();
    }

    // 4. ฟังก์ชันค้นหาข้อมูลความเร็วสูง
    async function searchData() {
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      const type = document.querySelector('input[name="searchType"]:checked').value;

      if (!keyword) {
        currentResults = [];
        document.getElementById('resultCount').innerText = 'พบข้อมูล 0 รายการ';
        return;
      }

      let query = db.records;
      
      if (type === 'tracking') {
        currentResults = await query.filter(r => r.tracking.includes(keyword)).toArray();
      } else if (type === 'order') {
        currentResults = await query.filter(r => r.order.includes(keyword)).toArray();
      } else if (type === 'phone') {
        currentResults = await query.filter(r => r.phone.includes(keyword)).toArray();
      } else {
        currentResults = await query.filter(r => r.searchBlob.includes(keyword)).toArray();
      }

      document.getElementById('resultCount').innerText = `พบข้อมูล ${currentResults.length} รายการ`;
    }

    // 5. ส่งออกเฉพาะข้อมูลที่ค้นหาพบเป็น Excel
    function exportExcel() {
      if (currentResults.length === 0) return alert('ไม่มีข้อมูลสำหรับส่งออก');
      const exportData = currentResults.map(r => r.raw);
      const ws = XLSX.utils.json_to_sheet(exportData);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "SearchResults");
      XLSX.writeFile(wb, "Search_Result.xlsx");
    }

    // 6. Preview ดูข้อมูล
    function previewResults() {
      if (currentResults.length === 0) return alert('ไม่มีข้อมูลให้แสดง');
      console.log(currentResults.map(r => r.raw));
      alert(`มีข้อมูลทั้งหมด ${currentResults.length} รายการ (เปิดดูรายละเอียดใน F12 Console ได้)`);
    }
  </script>
</body>
</html>
