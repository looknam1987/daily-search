<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Status Search</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <link rel="apple-touch-icon" href="icon-192.png">

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dexie@3.2.4/dist/dexie.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-6 border border-gray-200">
    <div class="text-center font-bold text-xl mb-4 text-gray-800">DAILY STATUS SEARCH</div>
    
    <div class="flex gap-2 mb-4">
      <input type="text" id="searchInput" oninput="searchData()" placeholder="พิมพ์คำค้นหา (Tracking, Order, Phone...)" class="flex-1 border border-gray-300 p-2.5 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      <button onclick="searchData()" class="bg-blue-600 text-white px-4 py-2.5 rounded-lg hover:bg-blue-700">🔍</button>
    </div>

    <div class="flex gap-4 text-sm mb-4 justify-center text-gray-600">
      <label class="cursor-pointer"><input type="radio" name="searchType" value="all" checked onchange="searchData()"> All</label>
      <label class="cursor-pointer"><input type="radio" name="searchType" value="tracking" onchange="searchData()"> Tracking</label>
      <label class="cursor-pointer"><input type="radio" name="searchType" value="order" onchange="searchData()"> Order</label>
      <label class="cursor-pointer"><input type="radio" name="searchType" value="phone" onchange="searchData()"> Phone</label>
    </div>

    <div class="mb-5 text-center">
      <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" onchange="loadExcel(event)" class="hidden">
      <label for="excelFile" class="inline-block cursor-pointer bg-blue-50 hover:bg-blue-100 text-blue-700 px-4 py-2.5 rounded-lg border border-blue-200 text-xs font-semibold transition">
        📁 เลือก/อัปเดตไฟล์ Excel ในเครื่อง
      </label>
    </div>

    <div class="text-sm font-bold text-gray-700 mb-4 border-b pb-2" id="resultCount">พบข้อมูล 0 รายการ</div>

    <div class="flex gap-3">
      <button onclick="previewResults()" class="flex-1 border border-gray-300 py-2 rounded-lg text-sm font-medium hover:bg-gray-50 text-gray-700">[ Preview ]</button>
      <button onclick="exportExcel()" class="flex-1 bg-green-600 text-white py-2 rounded-lg text-sm font-medium hover:bg-green-700 shadow-sm">[ EXPORT EXCEL ]</button>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    const db = new Dexie("StatusSearchDB");
    db.version(1).stores({
      records: '++id, tracking, order, phone, searchBlob'
    });

    let currentResults = [];

    async function loadExcel(e) {
      const file = e.target.files[0];
      if (!file) return;

      try {
        const data = await file.arrayBuffer();
        const workbook = XLSX.read(data, { type: 'array' });
        const sheetName = workbook.SheetNames[0];
        const json = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { defval: "" });

        if (json.length === 0) {
          alert('ไฟล์ไม่มีข้อมูล');
          return;
        }

        await db.records.clear();
        
        const formattedData = json.map(row => {
          const trackingVal = String(row['Tracking Number'] || row['Tracking Number Prefix'] || '').trim().toLowerCase();
          const orderVal = String(row['REFERENCE_NO'] || row['ORDER NO.'] || row['Order Code in OMS'] || row['SO_NO'] || '').trim().toLowerCase();
          const phoneVal = String(row['PHONE'] || '').trim().toLowerCase();
          const allBlob = Object.values(row).join(' ').toLowerCase();

          return {
            raw: row,
            tracking: trackingVal,
            order: orderVal,
            phone: phoneVal,
            searchBlob: allBlob
          };
        });

        await db.records.bulkAdd(formattedData);
        alert(`โหลดข้อมูลสำเร็จเรียบร้อย! ทั้งหมด ${json.length} รายการ`);
        searchData();
      } catch (err) {
        alert('เกิดข้อผิดพลาดในการอ่านไฟล์ โปรดใช้ไฟล์ .xlsx');
        console.error(err);
      }
    }

    async function searchData() {
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      const type = document.querySelector('input[name="searchType"]:checked').value;

      if (!keyword) {
        currentResults = [];
        document.getElementById('resultCount').innerText = 'พบข้อมูล 0 รายการ';
        return;
      }

      let query = db.records;
      
      if (type === 'tracking') {
        currentResults = await query.filter(r => r.tracking.includes(keyword)).toArray();
      } else if (type === 'order') {
        currentResults = await query.filter(r => r.order.includes(keyword)).toArray();
      } else if (type === 'phone') {
        currentResults = await query.filter(r => r.phone.includes(keyword)).toArray();
      } else {
        currentResults = await query.filter(r => r.searchBlob.includes(keyword)).toArray();
      }

      document.getElementById('resultCount').innerText = `พบข้อมูล ${currentResults.length} รายการ`;
    }

    // Export เฉพาะคอลัมน์ที่กำหนดไว้
    function exportExcel() {
      if (currentResults.length === 0) return alert('ไม่มีข้อมูลสำหรับส่งออก');
      
      const exportData = currentResults.map(r => {
        // รวมรายละเอียดที่อยู่อย่างต่อเนื่อง
        const fullAddress = [
          r.raw['ที่อยู่'],
          r.raw['ซอย'],
          r.raw['ถนน'],
          r.raw['ตำบล'],
          r.raw['อำเภอ'],
          r.raw['จังหวัด']
        ].filter(Boolean).join(' ');

        return {
          "LINE_NO": r.raw['LINE_NO'] || "",
          "DATE": r.raw['DATE'] || "",
          "REFERENCE_NO": r.raw['REFERENCE_NO'] || "",
          "REMARKS": r.raw['REMARKS'] || "",
          "ITEM_NO": r.raw['ITEM_NO'] || "",
          "QTY": r.raw['QTY'] || "",
          "UOM": r.raw['UOM'] || "",
          "CUSTOMER_NAME": r.raw['CUSTOMER_NAME'] || "",
          "ADDRESS": fullAddress,
          "POST_CODE": r.raw['POST_CODE'] || "",
          "PHONE": r.raw['PHONE'] || "",
          "Tracking Number": r.raw['Tracking Number'] || ""
        };
      });

      const ws = XLSX.utils.json_to_sheet(exportData);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "SearchResults");
      XLSX.writeFile(wb, "Search_Result.xlsx");
    }

    function previewResults() {
      if (currentResults.length === 0) return alert('ไม่มีข้อมูลให้แสดง');
      alert(`พบข้อมูลทั้งหมด ${currentResults.length} รายการ\nกด F12 เพื่อดูข้อมูลรายละเอียดใน Console ได้ครับ`);
      console.log(currentResults.map(r => r.raw));
    }
  </script>
</body>
</html>
