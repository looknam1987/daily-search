<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Status Search</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <link rel="apple-touch-icon" href="icon-192.png">

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dexie@3.2.4/dist/dexie.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">

  <div class="max-w-xl mx-auto bg-white rounded-xl shadow-lg p-6 border border-gray-200">
    <div class="text-center font-bold text-xl mb-4 text-gray-800">DAILY STATUS SEARCH</div>
    
    <!-- ช่องค้นหา -->
    <div class="flex gap-2 mb-4">
      <input type="text" id="searchInput" oninput="searchData()" placeholder="พิมพ์คำค้นหา (Tracking, Order, Phone...)" class="flex-1 border border-gray-300 p-2.5 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      <button onclick="searchData()" class="bg-blue-600 text-white px-4 py-2.5 rounded-lg hover:bg-blue-700">🔍</button>
    </div>

    <!-- ตัวเลือกประเภทการค้นหา -->
    <div class="flex gap-4 text-sm mb-4 justify-center text-gray-600">
      <label class="cursor-pointer"><input type="radio" name="searchType" value="all" checked onchange="searchData()"> All</label>
      <label class="cursor-pointer"><input type="radio" name="searchType" value="tracking" onchange="searchData()"> Tracking</label>
      <label class="cursor-pointer"><input type="radio" name="searchType" value="order" onchange="searchData()"> Order</label>
      <label class="cursor-pointer"><input type="radio" name="searchType" value="phone" onchange="searchData()"> Phone</label>
    </div>

    <!-- ปุ่มเลือกไฟล์ Excel -->
    <div class="mb-5 text-center">
      <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" onchange="loadExcel(event)" class="hidden">
      <label for="excelFile" class="inline-block cursor-pointer bg-blue-50 hover:bg-blue-100 text-blue-700 px-4 py-2.5 rounded-lg border border-blue-200 text-xs font-semibold transition">
        📁 เลือก/อัปเดตไฟล์ Excel ในเครื่อง
      </label>
    </div>

    <!-- จำนวนรายการและปุ่ม Export -->
    <div class="flex justify-between items-center mb-4 border-b pb-2">
      <div class="text-sm font-bold text-gray-700" id="resultCount">พบข้อมูล 0 รายการ</div>
      <button onclick="exportExcel()" class="bg-green-600 text-white px-4 py-1.5 rounded-lg text-sm font-medium hover:bg-green-700 shadow-sm">[ EXPORT EXCEL ]</button>
    </div>

    <!-- กล่องแสดงข้อความผลลัพธ์ -->
    <div id="resultsContainer" class="space-y-3 max-h-[450px] overflow-y-auto pr-1">
      <!-- ข้อมูลจากการค้นหาจะมาปรากฏตรงนี้ -->
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=4').catch(() => {});
      });
    }

    const db = new Dexie("StatusSearchDB");
    db.version(1).stores({
      records: '++id, tracking, order, phone, searchBlob'
    });

    let currentResults = [];

    async function loadExcel(e) {
      const file = e.target.files[0];
      if (!file) return;

      try {
        const data = await file.arrayBuffer();
        const workbook = XLSX.read(data, { type: 'array' });
        const sheetName = workbook.SheetNames[0];
        const json = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { defval: "" });

        if (json.length === 0) {
          alert('ไฟล์ไม่มีข้อมูล');
          return;
        }

        await db.records.clear();
        
        const formattedData = json.map(row => {
          const trackingVal = String(row['Tracking Number'] || row['Tracking Number Prefix'] || '').trim().toLowerCase();
          const orderVal = String(row['REFERENCE_NO'] || row['ORDER NO.'] || row['Order Code in OMS'] || row['SO_NO'] || '').trim().toLowerCase();
          const phoneVal = String(row['PHONE'] || '').trim().toLowerCase();
          const allBlob = Object.values(row).join(' ').toLowerCase();

          return {
            raw: row,
            tracking: trackingVal,
            order: orderVal,
            phone: phoneVal,
            searchBlob: allBlob
          };
        });

        await db.records.bulkAdd(formattedData);
        alert(`โหลดข้อมูลสำเร็จเรียบร้อย! ทั้งหมด ${json.length} รายการ`);
        searchData();
      } catch (err) {
        alert('เกิดข้อผิดพลาดในการอ่านไฟล์ โปรดใช้ไฟล์ .xlsx');
        console.error(err);
      }
    }

    async function searchData() {
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      const type = document.querySelector('input[name="searchType"]:checked').value;
      const container = document.getElementById('resultsContainer');

      if (!keyword) {
        currentResults = [];
        document.getElementById('resultCount').innerText = 'พบข้อมูล 0 รายการ';
        container.innerHTML = '';
        return;
      }

      let query = db.records;
      
      if (type === 'tracking') {
        currentResults = await query.filter(r => r.tracking.includes(keyword)).toArray();
      } else if (type === 'order') {
        currentResults = await query.filter(r => r.order.includes(keyword)).toArray();
      } else if (type === 'phone') {
        currentResults = await query.filter(r => r.phone.includes(keyword)).toArray();
      } else {
        currentResults = await query.filter(r => r.searchBlob.includes(keyword)).toArray();
      }

      document.getElementById('resultCount').innerText = `พบข้อมูล ${currentResults.length} รายการ`;
      renderCards();
    }

    function renderCards() {
      const container = document.getElementById('resultsContainer');
      container.innerHTML = '';

      if (currentResults.length === 0) {
        container.innerHTML = '<div class="text-center text-gray-400 py-4 text-sm">ไม่พบข้อมูลที่ค้นหา</div>';
        return;
      }

      currentResults.forEach((r, idx) => {
        const fullAddress = [
          r.raw['ที่อยู่'],
          r.raw['ซอย'],
          r.raw['ถนน'],
          r.raw['ตำบล'],
          r.raw['อำเภอ'],
          r.raw['จังหวัด']
        ].filter(Boolean).join(' ');

        const dateVal = r.raw['DATE'] || '-';
        const receivingDateVal = r.raw['Receiving Date'] || '-';
        const statusVal = r.raw['Status'] || '-';
        const remarkVal = r.raw['Remark'] || '-';

        // ข้อความสำหรับก๊อปปี้
        const textToCopy = `REF: ${r.raw['REFERENCE_NO'] || '-'}\nDATE: ${dateVal}\nTracking: ${r.raw['Tracking Number'] || '-'}\nชื่อ: ${r.raw['CUSTOMER_NAME'] || '-'}\nโทร: ${r.raw['PHONE'] || '-'}\nที่อยู่: ${fullAddress || '-'} ${r.raw['POST_CODE'] || ''}\nสินค้า: ${r.raw['ITEM_NO'] || '-'} (${r.raw['QTY'] || '-'} ${r.raw['UOM'] || ''})${r.raw['REMARKS'] ? `\nCOD: ${r.raw['REMARKS']}` : ''}\nReceiving Date: ${receivingDateVal}\nStatus: ${statusVal}\nRemark: ${remarkVal}`;

        const card = document.createElement('div');
        card.className = 'bg-gray-50 border border-gray-200 rounded-lg p-3.5 text-xs text-gray-700 space-y-1.5 shadow-sm relative group';
        card.innerHTML = `
          <div class="flex justify-between items-center border-b pb-1 pr-14">
            <span class="font-bold text-blue-600">#${idx + 1} REF: ${r.raw['REFERENCE_NO'] || '-'}</span>
          </div>
          <button onclick="copyToClipboard(\`${encodeURIComponent(textToCopy)}\`, this)" class="absolute top-2.5 right-2 bg-white border border-gray-300 hover:bg-blue-50 hover:text-blue-600 hover:border-blue-300 px-2 py-1 rounded text-[11px] font-medium transition flex items-center gap-1 shadow-sm">
            📋 Copy
          </button>
          <div><span class="font-semibold text-gray-900">DATE:</span> ${dateVal}</div>
          <div><span class="font-semibold text-gray-900">Tracking:</span> ${r.raw['Tracking Number'] || '-'}</div>
          <div><span class="font-semibold text-gray-900">ชื่อลูกค้า:</span> ${r.raw['CUSTOMER_NAME'] || '-'} (${r.raw['PHONE'] || '-'})</div>
          <div><span class="font-semibold text-gray-900">ที่อยู่:</span> ${fullAddress || '-'} ${r.raw['POST_CODE'] || ''}</div>
          <div class="flex gap-4">
            <span><span class="font-semibold text-gray-900">สินค้า:</span> ${r.raw['ITEM_NO'] || '-'}</span>
            <span><span class="font-semibold text-gray-900">จำนวน:</span> ${r.raw['QTY'] || '-'} ${r.raw['UOM'] || ''}</span>
          </div>
          ${r.raw['REMARKS'] ? `<div class="text-gray-500 italic"><span class="font-semibold">COD:</span> ${r.raw['REMARKS']}</div>` : ''}
          
          <!-- ส่วนข้อมูลที่เพิ่มด้านล่างสุด -->
          <div class="border-t pt-1.5 mt-1.5 space-y-1 text-gray-800">
            <div><span class="font-semibold text-gray-900">Receiving Date:</span> ${receivingDateVal}</div>
            <div><span class="font-semibold text-gray-900">Status:</span> ${statusVal}</div>
            <div><span class="font-semibold text-gray-900">Remark:</span> ${remarkVal}</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function copyToClipboard(encodedText, btn) {
      const text = decodeURIComponent(encodedText);
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btn.innerHTML;
        btn.innerHTML = '✅ สำเร็จ';
        btn.classList.add('bg-green-50', 'text-green-600', 'border-green-300');
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.classList.remove('bg-green-50', 'text-green-600', 'border-green-300');
        }, 1500);
      }).catch(err => {
        alert('ไม่สามารถคัดลอกข้อความได้');
        console.error(err);
      });
    }

    function exportExcel() {
      if (currentResults.length === 0) return alert('ไม่มีข้อมูลสำหรับส่งออก');
      
      const exportData = currentResults.map(r => {
        const fullAddress = [
          r.raw['ที่อยู่'],
          r.raw['ซอย'],
          r.raw['ถนน'],
          r.raw['ตำบล'],
          r.raw['อำเภอ'],
          r.raw['จังหวัด']
        ].filter(Boolean).join(' ');

        return {
          "LINE_NO": r.raw['LINE_NO'] || "",
          "DATE": r.raw['DATE'] || "",
          "REFERENCE_NO": r.raw['REFERENCE_NO'] || "",
          "REMARKS": r.raw['REMARKS'] || "",
          "ITEM_NO": r.raw['ITEM_NO'] || "",
          "QTY": r.raw['QTY'] || "",
          "UOM": r.raw['UOM'] || "",
          "CUSTOMER_NAME": r.raw['CUSTOMER_NAME'] || "",
          "ADDRESS": fullAddress,
          "POST_CODE": r.raw['POST_CODE'] || "",
          "PHONE": r.raw['PHONE'] || "",
          "Tracking Number": r.raw['Tracking Number'] || "",
          "Receiving Date": r.raw['Receiving Date'] || "",
          "Status": r.raw['Status'] || "",
          "Remark": r.raw['Remark'] || ""
        };
      });

      const ws = XLSX.utils.json_to_sheet(exportData);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "SearchResults");
      XLSX.writeFile(wb, "Search_Result.xlsx");
    }
  </script>
</body>
</html>
